services:
  postgres:
    # Audit #31: pin minor version explicitly.  `postgres:16-alpine` floats —
    # a silent base-image bump can break extensions or change locale behaviour.
    # Bumped 16.4 -> 16.13 so the server's bundled psql understands the `\restrict`
    # directive emitted by pg_dump 16.13+, so backups restore byte-clean with the
    # server's own client (16.4 psql errored: "invalid command \restrict").
    image: postgres:16.13-alpine
    container_name: musicstream-postgres
    environment:
      POSTGRES_DB: musicstream
      POSTGRES_USER: musicstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    # Cap docker json-file logs — without this, /var/lib/docker/containers/<id>-json.log
    # grows without bound (saw 44 MB on neighbour projects). 10m × 3 = 30 MB max per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Audit #31: drop ambient capabilities + lock down the security profile.
    # Postgres runs as its own UID inside the image so it doesn't need any
    # of the SUID dance in the default seccomp profile.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  plex:
    image: plexinc/pms-docker:latest
    container_name: musicstream-plex
    environment:
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN}
      - ADVERTISE_IP=http://${TAILSCALE_IP}:32400/
      - TZ=Asia/Singapore
    volumes:
      - ${EXTERNAL_MEDIA_DRIVE}:/media:ro
      - ./plex/config:/config
      - ./plex/transcode:/transcode
    ports:
      - "0.0.0.0:32400:32400"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  scrobbler:
    image: foxxmd/multi-scrobbler:latest
    container_name: musicstream-scrobbler
    volumes:
      - ./scrobbler/config:/config
    ports:
      - "9078:9078"
    environment:
      - TZ=Asia/Singapore
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - plex
    healthcheck:
      test: ["CMD", "curl", "-sfL", "http://localhost:9078/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: musicstream-daemon
    env_file:
      - .env
    volumes:
      - ${EXTERNAL_MEDIA_DRIVE}:/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # data/ persists librespot credential blob across rebuilds.
      # gitignored - never committed. Created by daemon on first librespot auth.
      - ./data:/app/data
      # Bind-mount token files so OAuth refresh + browser-callback writes
      # persist across image rebuilds. Earlier code baked these via COPY but
      # .dockerignore now excludes them; mount is the durable path.
      - ./spotify_token.json:/app/spotify_token.json
      - ./cookies.txt:/app/cookies.txt
    ports:
      - "9079:9079"
    environment:
      - TZ=Asia/Singapore
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://musicstream:${POSTGRES_PASSWORD}@postgres:5432/musicstream
      - PLEX_URL=http://musicstream-plex:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_LIBRARY_SECTION_ID=${PLEX_LIBRARY_SECTION_ID}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_TOKEN_CACHE=/app/spotify_token.json
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN}
      - LISTENBRAINZ_USERNAME=${LISTENBRAINZ_USERNAME}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY}
      - QOBUZ_EMAIL=${QOBUZ_EMAIL}
      - QOBUZ_PASSWORD_MD5=${QOBUZ_PASSWORD_MD5}
      # Tier 0: librespot (direct Spotify CDN — requires Premium account)
      # After first auth the credential blob is saved; password not needed again.
      - SPOTIFY_USERNAME=${SPOTIFY_USERNAME:-}
      - SPOTIFY_PASSWORD=${SPOTIFY_PASSWORD:-}
      - LIBRESPOT_CREDENTIALS_FILE=/app/data/librespot_credentials.json
      # Set to 1/true/yes/on to disable downloads (for staging/development)
      - DISABLE_DOWNLOADS=${DISABLE_DOWNLOADS:-}
      # Worker concurrency for parallel downloads (default: 12 - MAXIMUM SPEED 🚀)
      # 12 workers = 3x faster than original 4 workers. Monitor for rate limits!
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-12}
      # Audit #6/#28: Bearer token enforced on all mutating endpoints.
      # Daemon refuses to start (503 on every protected route) unless this
      # is set, so it MUST be present in your .env.  See .env.example for
      # how to generate a strong value.  DAEMON_DEV_NOAUTH=*** opt-in
      # bypass for local dev only — never set in production.
      - DAEMON_API_TOKEN=${DAEMON_API_TOKEN}
      - DAEMON_DEV_NOAUTH=***
      # Audit #13: persisted throttle state (rate-limiter backoff history)
      # so a daemon restart doesn't reset cooldowns and re-trigger 429s.
      - THROTTLE_STATE_PATH=/app/data/throttle_state.json
      # Container-internal mount point for the media drive — always /media
      # regardless of the host path in EXTERNAL_MEDIA_DRIVE.
      - MEDIA_DIR=/media
    # Use public DNS — Docker's internal resolver ([Errno -2] Name or service not known)
    # can fail to resolve some hostnames.  Cloudflare first, Google as fallback.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    # P0-2: give uvicorn time to run the lifespan shutdown drain (reset
    # in-flight DOWNLOADING rows) before SIGKILL. The default 10s is too short
    # — uvicorn's graceful shutdown (connection drain + lifespan) can exceed it
    # under an active download pipeline, killing the drain mid-way. With this,
    # `docker compose stop/restart/down` drains cleanly; P0-1's boot reset stays
    # the authoritative backstop if a hard kill still occurs.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Audit #31: prevent runtime privilege escalation; the daemon is now
    # non-root via Dockerfile USER directive and never legitimately
    # needs setuid binaries.
    security_opt:
      - no-new-privileges:true
    # Audit #31: cap memory so a runaway tagger / ffmpeg loop OOMs the
    # daemon container without taking the whole host with it.  Tune to
    # taste — 2G is generous given typical ingestion working sets.
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9079/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
