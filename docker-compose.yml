services:
  postgres:
    image: postgres:16-alpine
    container_name: musicstream-postgres
    environment:
      POSTGRES_DB: musicstream
      POSTGRES_USER: musicstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  plex:
    image: plexinc/pms-docker:latest
    container_name: musicstream-plex
    environment:
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN}
      - ADVERTISE_IP=http://${TAILSCALE_IP}:32400/
      - TZ=Asia/Singapore
    volumes:
      - ${EXTERNAL_MEDIA_DRIVE}:/media:ro
      - ./plex/config:/config
      - ./plex/transcode:/transcode
    ports:
      - "32400:32400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  scrobbler:
    image: foxxmd/multi-scrobbler:latest
    container_name: musicstream-scrobbler
    volumes:
      - ./scrobbler/config:/config
    ports:
      - "9078:9078"
    environment:
      - TZ=Asia/Singapore
    restart: unless-stopped
    depends_on:
      - plex
    healthcheck:
      test: ["CMD", "curl", "-sfL", "http://localhost:9078/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: musicstream-daemon
    env_file:
      - .env
    volumes:
      - ${EXTERNAL_MEDIA_DRIVE}:/media
      - ./logs:/app/logs
      - ./backups:/app/backups
    # cookies.txt and spotify_token.json are baked into the image via COPY . .
    # File bind-mounts with spaces in the host path fail on Docker Desktop / WSL2.
    ports:
      - "9079:9079"
    environment:
      - TZ=Asia/Singapore
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://musicstream:${POSTGRES_PASSWORD}@postgres:5432/musicstream
      - PLEX_URL=http://musicstream-plex:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_LIBRARY_SECTION_ID=${PLEX_LIBRARY_SECTION_ID}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_TOKEN_CACHE=/app/spotify_token.json
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN}
      - LISTENBRAINZ_USERNAME=${LISTENBRAINZ_USERNAME}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY}
      - QOBUZ_EMAIL=${QOBUZ_EMAIL}
      - QOBUZ_PASSWORD_MD5=${QOBUZ_PASSWORD_MD5}
      # Set to 1/true/yes/on to disable downloads (for staging/development)
      - DISABLE_DOWNLOADS=${DISABLE_DOWNLOADS:-}
      # Worker concurrency for parallel downloads (default: 4)
      # Increasing to 6-8 improves speed but may trigger API rate limits
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-6}
      # Container-internal mount point for the media drive — always /media
      # regardless of the host path in EXTERNAL_MEDIA_DRIVE.
      - MEDIA_DIR=/media
    # Use public DNS — Docker's internal resolver ([Errno -2] Name or service not
    # known) fails to resolve SpotiFLAC backend hostnames (monochrome.tf,
    # deezmate.com, spotisaver.net).  Cloudflare first, Google as fallback.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9079/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
