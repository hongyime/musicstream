name: Publish container images
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: [{"name": "daemon", "context": ".", "file": "Dockerfile.daemon"}]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify manifest retention rules
        run: node --test .github/scripts/ghcr-retention.test.cjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: production
          platforms: linux/amd64
          # Single architecture without attestations; retention also inspects manifests.
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify production dependency isolation
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          ref="$IMAGE:sha-${GITHUB_SHA::7}"
          docker pull "$ref"
          docker run --rm --entrypoint python "$ref" -c 'import importlib.metadata as m; names={d.metadata.get("Name", "").lower().replace("_", "-") for d in m.distributions()}; banned={"pytest", "pytest-cov", "pytest-asyncio", "hypothesis", "mypy", "ruff", "ast-serialize"}; found=sorted(names & banned); assert not found, found; print("Production development-tool exclusion passed")'
      - name: Record published image size
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --raw |
            python -c 'import json,sys; m=json.load(sys.stdin); print("Compressed layer bytes:", sum(x["size"] for x in m.get("layers", [])))'

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: [{"name": "daemon"}]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package name
        id: package
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          COMPONENT: ${{ matrix.name }}
        run: echo "name=${REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - name: Verify package visibility
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        with:
          script: |
            const owner = context.repo.owner;
            const {data: account} = await github.rest.users.getByUsername({username: owner});
            const prefix = account.type === 'Organization' ? 'orgs' : 'users';
            const route = 'GET /' + prefix + '/' + encodeURIComponent(owner) + '/packages/container/' + encodeURIComponent(process.env.PACKAGE_NAME);
            const {data: pkg} = await github.request(route);
            core.info('Package visibility: ' + pkg.visibility);
            await core.summary.addHeading('Package access').addRaw(process.env.PACKAGE_NAME + ': ' + pkg.visibility).write();
            if (pkg.visibility !== 'public') core.warning('Set this package to public in GitHub package settings, then verify anonymous access.');
      - name: Verify manifests and select old tagged versions
        id: retention
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        with:
          script: |
            const plan = require('./.github/scripts/ghcr-retention.cjs');
            await plan({github, context, core});
      - name: Retain three untagged versions
        if: steps.retention.outputs.safe_single_arch == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ steps.package.outputs.name }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 3
      - name: Bound tagged history separately
        if: steps.retention.outputs.tagged_ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ steps.package.outputs.name }}
          package-type: container
          package-version-ids: ${{ steps.retention.outputs.tagged_ids }}
